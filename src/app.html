    <!-- Script de configuración temprana -->
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('rupaq.settings.v1');
          if (!raw) return;
          const s = JSON.parse(raw);
          document.documentElement.style.setProperty('--font-scale', String(s.fontScale || 1));
          if (s.simple) document.documentElement.classList.add('simple-mode');
          if (s.contrast) document.documentElement.classList.add('high-contrast');
        } catch (_) {}
      })();
    </script>
